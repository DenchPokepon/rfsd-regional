[project]
name = "rfsd-regional"
version = "0.1.0"
description = "Regional analytics on RFSD with Polars"
readme = "README.md"
authors = [
    { name = "Denis", email = "deniskrylovvit@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "polars>=1.44.2",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
download = ["huggingface-hub>=2.0.0"]
analysis = [
    "openpyxl>=3.1.5",
    "xlsxwriter>=3.2.9",
]
plots = ["matplotlib>=3.10"]
dev = [
    { include-group = "analysis" },
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the local RFSD and Rosstat source files"]
addopts = "--basetemp=outputs/pytest-tmp"
