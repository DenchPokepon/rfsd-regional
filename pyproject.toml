[project]
name = "firm-level"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Denis", email = "deniskrylovvit@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=2.0.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
]

[project.scripts]
firm-level = "firm_level.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
